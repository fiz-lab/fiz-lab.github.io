 <svg class="fl-diagram" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="786.52" viewBox="0 0 960 786.52" role="img" aria-labelledby="fl-title fl-desc">
 <title id="fl-title">Closed-loop wireless intelligence with Task Expert Models</title><desc id="fl-desc">Conceptual research architecture. Synthetic photorealistic 3D illustrations depict a physical wireless environment with a base station illuminating a car and two smartphone users, represented only by phones; Camera, a physical radar dish antenna, and RF sensing; a real-time Digital Twin with geometry and channel state; a robot representing the Multimodal LLM for context-aware reasoning; autonomous optimization problem formulation; feasibility checks of domains, constraints, optimality and simulator dry-run; four neural-brain Task Expert Models, each solving its own specialized problem; diverse wireless task solutions illustrated by beamforming, channel estimation, scheduling and localization; network evaluation; and state feedback to the Digital Twin. E1, E2, E3 and E4 denote separate expert models with individual problem inputs and solution outputs. Infeasible formulations return to the large model for revision. Natural-language evaluation feedback supports learning and adaptation of the expert models. The animation illustrates a proposed workflow, not measured latency or performance.</desc>
