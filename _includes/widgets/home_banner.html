<style>
.fz-banner{position:relative;aspect-ratio:16/10;margin-bottom:1.5rem;border-radius:.8rem;overflow:hidden;background:linear-gradient(90deg,#cde3f5 0%,#d1e2f5 60%,#dae0f3 100%);box-shadow:0 2px 12px rgba(13,68,225,.07)}
.fz-banner iframe{position:absolute;left:0;top:0;width:100%;height:auto;aspect-ratio:16/9;border:0;display:block}
.fz-vision{position:absolute;left:0;right:0;bottom:0;padding:2.6rem 4% 1.15rem;pointer-events:none;
  background:linear-gradient(180deg,rgba(238,245,255,0) 0%,rgba(238,245,255,.86) 42%,rgba(244,248,255,.95) 100%)}
.fz-vision h2{margin:0;font-size:clamp(1.05rem,2.3vw,1.45rem);line-height:1.25;font-weight:700;letter-spacing:-.015em;color:#162d51}
.fz-vision p{margin:.4rem 0 0;max-width:41rem;font-size:clamp(.82rem,1.45vw,.95rem);line-height:1.55;color:#49627d}
.fz-vision .s{color:#0d44e1}.fz-vision .n{color:#6a4fd8}.fz-vision .r{color:#b34483}
@media (max-width:550px){.fz-banner{aspect-ratio:8/8.6}.fz-banner iframe{aspect-ratio:8/7}.fz-vision{padding:2rem 4.2% .9rem}.fz-vision p{display:none}}
</style>
<div class="mt-3 d-md-none"></div>
<div class="fz-banner">
    <iframe id="fz-banner-frame" src="{{ '/assets/hero/fizlab-banner.html' | relative_url }}" title="FIZLab: robots sensing their surroundings and communicating with a base station" scrolling="no"></iframe>
    <div class="fz-vision">
        <h2>Uniting <span class="s">sensing</span>, <span class="n">networks</span>, and <span class="r">robotics</span> into one intelligent loop.</h2>
        <p>We build wireless systems that perceive the physical world, orchestrate radio and edge compute as one, and let fleets of robots sense, decide, and act together in real time.</p>
    </div>
</div>
<script>
(function () {
    var f = document.getElementById('fz-banner-frame');
    if (!f) return;
    // The banner starts paused when the OS asks for reduced motion; start it here so it always plays.
    f.addEventListener('load', function () {
        try { f.contentWindow.postMessage({ type: 'fizlab-motion', playing: true }, location.origin); } catch (e) {}
    });
})();
</script>
