<style>
.nfr-loop{--navy:#172c50;--blue:#246bc5;--purple:#7653ad;margin:0 auto;max-width:1120px;padding:18px;background:linear-gradient(145deg,#fff 65%,#f7f9fd);border:1px solid #e0e7ef;border-radius:14px;font-family:Arial,Helvetica,sans-serif;box-sizing:border-box}
.nfr-loop .nfr-scroll{overflow-x:auto}
.nfr-loop svg{display:block;width:100%;min-width:640px;height:auto}
.nfr-loop .node{fill:#fff;stroke:#dbe4ef;stroke-width:1.4}
.nfr-loop .halo{fill:#f0f5fc}
.nfr-loop .halo.p{fill:#f3eefb}
.nfr-loop .title{font-size:21px;font-weight:700;fill:var(--navy)}
.nfr-loop .sub{font-size:15px;fill:#6a7890}
.nfr-loop .flow-lbl{font-size:14px;font-weight:600}
.nfr-loop .up{fill:none;stroke:#9dbbe0;stroke-width:2.4}
.nfr-loop .down{fill:none;stroke:#c3ade6;stroke-width:2.4}
.nfr-loop .pulse{fill:none;stroke:var(--blue);stroke-width:3.4;stroke-linecap:round;stroke-dasharray:.14 1;stroke-dashoffset:.14;animation:nfr-travel 2.6s linear infinite}
.nfr-loop .pulse.back{stroke:var(--purple)}
.nfr-loop .belt{fill:#e6ecf3;stroke:#cdd8e5}
.nfr-loop .roller{fill:#fff;stroke:#b9c7d8}
.nfr-loop .cube{fill:#e9b767;stroke:#c99540;animation:nfr-belt 6s linear infinite}
.nfr-loop .arm{fill:none;stroke:var(--navy);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.nfr-loop .joint{fill:#c9b4e9;stroke:var(--purple);stroke-width:1.5}
.nfr-loop .grip{fill:none;stroke:var(--navy);stroke-width:3;stroke-linecap:round}
.nfr-loop .tower{fill:none;stroke:var(--navy);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.nfr-loop .wave{fill:none;stroke:var(--blue);stroke-width:2.4;stroke-linecap:round;animation:nfr-wave 1.8s ease-in-out infinite}
.nfr-loop .rack{fill:#25466b}
.nfr-loop .unit{fill:#3a5f8a}
.nfr-loop .led{fill:#71bedb;animation:nfr-wave 1.4s ease-in-out infinite}
.nfr-loop .chip{fill:#7653ad}
@keyframes nfr-travel{to{stroke-dashoffset:-1}}
@keyframes nfr-belt{0%{transform:translateX(0);opacity:0}8%{opacity:1}90%{opacity:1}100%{transform:translateX(150px);opacity:0}}
@keyframes nfr-wave{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.nfr-loop .pulse,.nfr-loop .cube,.nfr-loop .wave,.nfr-loop .led{animation:none}.nfr-loop .pulse{stroke-dasharray:none;opacity:.35}}
</style>
<figure class="nfr-loop">
<div class="nfr-scroll">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" role="img" aria-label="Network for robotics: robots send sensing data over the radio access network to an AI-RAN server, which returns actions to the robots.">
<defs>
<marker id="nfr-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9.5,5 L0,9 z" fill="#86a6ce"/></marker>
<marker id="nfr-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9.5,5 L0,9 z" fill="#a98ad6"/></marker>
</defs>

<!-- robots -->
<rect x="60" y="30" width="240" height="210" rx="18" class="node"/>
<circle cx="180" cy="128" r="82" class="halo"/>
<path d="M136 162 L126 120 L162 110" class="arm"/>
<circle cx="136" cy="162" r="5" class="joint"/><circle cx="126" cy="120" r="5" class="joint"/>
<path d="M162 110 V124 M156 124 H168 M156 124 V133 M168 124 V133" class="grip"/>
<rect x="122" y="162" width="28" height="9" rx="3" fill="#25466b"/>
<path d="M216 162 L206 120 L242 110" class="arm"/>
<circle cx="216" cy="162" r="5" class="joint"/><circle cx="206" cy="120" r="5" class="joint"/>
<path d="M242 110 V124 M236 124 H248 M236 124 V133 M248 124 V133" class="grip"/>
<rect x="202" y="162" width="28" height="9" rx="3" fill="#25466b"/>
<rect x="100" y="176" width="160" height="18" rx="9" class="belt"/>
<circle cx="110" cy="185" r="6" class="roller"/><circle cx="250" cy="185" r="6" class="roller"/>
<rect x="104" y="163" width="13" height="13" rx="2" class="cube"/>
<rect x="104" y="163" width="13" height="13" rx="2" class="cube" style="animation-delay:-3s"/>
<text x="180" y="280" text-anchor="middle" class="title">Robots</text>
<text x="180" y="304" text-anchor="middle" class="sub">VLA-driven robot fleet</text>

<!-- RAN -->
<rect x="420" y="30" width="240" height="210" rx="18" class="node"/>
<circle cx="540" cy="128" r="82" class="halo"/>
<path d="M540 92 L518 196 M540 92 L562 196 M526 160 H554 M531 134 H549 M526 160 L549 134 M554 160 L531 134 M518 196 H562" class="tower"/>
<rect x="528" y="72" width="7" height="24" rx="2" fill="#246bc5"/><rect x="545" y="72" width="7" height="24" rx="2" fill="#246bc5"/>
<path d="M512 70 q-12 14 0 28 M500 60 q-22 24 0 48" class="wave"/>
<path d="M568 70 q12 14 0 28 M580 60 q22 24 0 48" class="wave" style="animation-delay:.4s"/>
<text x="540" y="280" text-anchor="middle" class="title">RAN</text>
<text x="540" y="304" text-anchor="middle" class="sub">Wireless access network</text>

<!-- AI-RAN server -->
<rect x="780" y="30" width="240" height="210" rx="18" class="node"/>
<circle cx="900" cy="128" r="82" class="halo p"/>
<rect x="858" y="70" width="70" height="118" rx="8" class="rack"/>
<rect x="866" y="80" width="54" height="22" rx="3" class="unit"/><rect x="866" y="108" width="54" height="22" rx="3" class="unit"/><rect x="866" y="136" width="54" height="22" rx="3" class="unit"/><rect x="866" y="164" width="54" height="16" rx="3" class="unit"/>
<circle cx="910" cy="91" r="3" class="led"/><circle cx="910" cy="119" r="3" class="led" style="animation-delay:.3s"/><circle cx="910" cy="147" r="3" class="led" style="animation-delay:.6s"/>
<path d="M926 132 V126 M938 132 V126 M950 132 V126 M926 182 V188 M938 182 V188 M950 182 V188 M914 144 H908 M914 156 H908 M914 168 H908 M962 144 H968 M962 156 H968 M962 168 H968" stroke="#a98ad6" stroke-width="2.2"/>
<rect x="914" y="132" width="48" height="50" rx="6" class="chip"/>
<text x="938" y="163" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#fff">GPU</text>
<text x="900" y="280" text-anchor="middle" class="title">AI-RAN server</text>
<text x="900" y="304" text-anchor="middle" class="sub">Edge AI on shared GPU</text>

<!-- flows -->
<path d="M306 112 H414" class="up" marker-end="url(#nfr-a)"/>
<path d="M306 112 H414" class="pulse" pathLength="1"/>
<path d="M414 152 H306" class="down" marker-end="url(#nfr-p)"/>
<path d="M414 152 H306" class="pulse back" pathLength="1" style="animation-delay:1.3s"/>
<path d="M666 112 H774" class="up" marker-end="url(#nfr-a)"/>
<path d="M666 112 H774" class="pulse" pathLength="1" style="animation-delay:.6s"/>
<path d="M774 152 H666" class="down" marker-end="url(#nfr-p)"/>
<path d="M774 152 H666" class="pulse back" pathLength="1" style="animation-delay:.7s"/>
<text x="360" y="100" text-anchor="middle" class="flow-lbl" fill="#246bc5">Sensing</text>
<text x="360" y="176" text-anchor="middle" class="flow-lbl" fill="#7653ad">Action</text>
<text x="720" y="100" text-anchor="middle" class="flow-lbl" fill="#246bc5">Sensing</text>
<text x="720" y="176" text-anchor="middle" class="flow-lbl" fill="#7653ad">Action</text>
</svg>
</div>
</figure>
