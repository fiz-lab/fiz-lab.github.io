<!doctype html>
<html lang="ko" data-mode="picker" data-roster="01,03,13,18">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e5f1ff"><title>FIZLab · 로봇 도감과 배너 선택</title>

<style>:root{color-scheme:light;--ink:#162d51;--muted:#49627d;--blue:#0d44e1;--pink:#b34483}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;color:var(--ink);font-family:Lato,"Helvetica Neue",Arial,sans-serif;background:#f6f8fb}
body{min-height:100vh;min-height:100svh;display:grid;place-items:center}
.hero{position:relative;isolation:isolate;width:min(100%,825px);aspect-ratio:16/9;overflow:hidden;background:#d5e9ff;border-radius:.8rem;container-type:size;box-shadow:0 3px 18px #25487712}
#field{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:-1}
.overlay{position:absolute;inset:0;pointer-events:none}
.identity{position:absolute;left:4%;top:5.6%;margin:0}
.identity img{display:block;width:min(23cqw,196px);height:auto}
h1{margin:.59em 0 0;font-size:clamp(14px,2.39cqw,22px);font-weight:650;line-height:1.12;letter-spacing:-.05em}
.key{position:absolute;top:6.7%;right:4%;display:flex;align-items:center;gap:5px 12px;font-size:clamp(9px,1.36cqw,12px);font-weight:600;color:#344c70}
.key span{display:flex;align-items:center;gap:4px}
.key i{display:inline-block;position:relative;width:14px;height:1.25px;background:var(--blue)}
.key i:after{content:"";position:absolute;right:0;top:-2.4px;border-top:3px solid transparent;border-bottom:3px solid transparent;border-left:5px solid var(--blue)}
.key .up{transform:rotate(180deg);background:var(--pink)}
.key .up:after{border-left-color:var(--pink)}
.missions{position:absolute;inset:auto 0 0;padding:clamp(7px,1.05cqw,11px) 8.5% clamp(8px,1.2cqw,13px) 4%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:rgba(242,248,255,.89);border-top:1px solid #aac5e080;align-items:start}
.mission{margin:0;padding-left:clamp(8px,1.7cqw,17px);border-left:1px solid #a6bdd599}
.mission:first-child{padding-left:0;border:0}
.mission dt{font-size:clamp(9px,1.28cqw,11px);line-height:1.2;color:var(--muted);font-weight:600}
.mission dd{margin:.31em 0 0;font-size:clamp(10px,1.55cqw,13px);font-weight:650;line-height:1.23;color:#1a3764}
#motion-toggle{pointer-events:auto;position:absolute;bottom:2.3%;right:2.2%;width:clamp(29px,4.25cqw,36px);height:clamp(29px,4.25cqw,36px);display:grid;place-items:center;border:1px solid #91adcf;border-radius:50%;background:#f0f7ff;color:#324e77;cursor:pointer}
#motion-toggle:hover{background:#fff;border-color:#315faa}
#motion-toggle:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.pause-mark{width:9px;height:11px;border:0 solid currentColor;border-left-width:3px;border-right-width:3px}
#motion-toggle[data-playing=false] .pause-mark{width:0;height:0;border:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:8px solid currentColor;margin-left:2px}
.background-only body{min-height:0;display:block}
.background-only .hero{width:100%;max-width:none;height:100vh;height:100svh;aspect-ratio:auto;border-radius:0;box-shadow:none}
.background-only .overlay{display:none}
@media(max-width:520px){.hero{aspect-ratio:8/7}}
@container(max-width:520px){
 .identity img{width:28.5cqw}
 .identity{top:5.4%;left:4.2%}
 h1{font-size:clamp(12px,3.28cqw,17px);margin-top:.63em}
 .key{top:5.8%;right:4%;gap:3px 6px;font-size:9px}
 .key i{width:10px}
 .mission{padding-left:6px}.missions{padding-right:12.1%}
 .mission dd{min-height:2.46em;font-size:clamp(9.5px,2.7cqw,11.5px)}
 #motion-toggle{width:30px;height:30px;bottom:3.8%}
}

.embedded body{min-height:0;display:block}
.embedded .hero{height:100vh;height:100svh;width:100%;max-width:none;aspect-ratio:auto;box-shadow:none}

[hidden]{display:none!important}
.banner-shell{width:min(100%,825px)}
.banner-shell .hero{width:100%}
.page-controls{display:flex;align-items:center;justify-content:center;gap:14px;color:#425b79;margin:12px auto 0;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.page-controls button{appearance:none;background:#fff;border:1px solid #bbcce0;color:#264a81;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:18px;display:grid;place-items:center}
.page-controls button:hover{background:#eaf4ff}
#empty-hero{position:absolute;inset:35% 10% auto;margin:auto;text-align:center;color:#193666;background:#f3f9ffe8;border:1px solid #aecee6;border-radius:12px;padding:14px;font-size:14px}
.background-only .banner-shell,.embedded .banner-shell{width:100%;max-width:none}
.background-only .page-controls,.embedded .page-controls{display:none}

html[data-mode=picker]{background:#f5f8fc}
html[data-mode=picker] body{display:block;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;line-height:1.5;letter-spacing:-.018em;background:#f5f8fc;color:#183051}
.workbench{max-width:1184px;padding:clamp(26px,4.8vw,66px) clamp(16px,3.5vw,44px) 70px;margin:0 auto}
.workbench button,dialog button{font:inherit;letter-spacing:inherit;cursor:pointer}
.workbench button:focus-visible,dialog button:focus-visible,.card-choice input:focus-visible{outline:3px solid #096cd3;outline-offset:3px}
.workbench :disabled{opacity:.48;cursor:default}
.opening{margin:0 0 26px}
.opening h1{font-size:clamp(27px,4.3vw,48px);font-weight:780;line-height:1.16;letter-spacing:-.07em;margin:0;color:#152d53;word-break:keep-all}
.opening p,.catalog-intro p{font-size:15px;color:#526984;margin:12px 0 0;word-break:keep-all}
.workspace{display:grid;grid-template-columns:minmax(0,2.35fr) minmax(240px,.86fr);gap:16px;align-items:stretch}
.preview-wrap{align-self:start;min-width:0}
.workspace .hero{width:100%;box-shadow:none;outline:1px solid #b5cce3;outline-offset:-1px;border-radius:15px}
.selection{display:flex;min-width:0;flex-direction:column;align-self:start;min-height:min(365px,35vw);background:#fff;padding:clamp(18px,2vw,27px);border:1px solid #c5d3e2;border-radius:15px}
.selection-heading,.catalog-intro{display:flex;justify-content:space-between;align-items:center;gap:14px}
.selection h2,.catalog h2,.detail-header h2{margin:0;color:#193255;font-size:21px;line-height:1.25;font-weight:740;letter-spacing:-.055em}
#selection-count{color:#0d44c1;background:#eaf2ff;border-radius:999px;white-space:nowrap;font-size:13px;padding:3px 9px;font-variant-numeric:tabular-nums}
.selection-hint{font-size:14px;color:#526780;line-height:1.6;margin:12px 0 14px;word-break:keep-all}
#selection-list{display:flex;align-content:flex-start;align-items:flex-start;flex-wrap:wrap;gap:6px;max-height:160px;overflow:auto;padding:3px 2px 8px;color:#667a90;font-size:13px}
.selection-chip{border:1px solid #d0dff1;color:#244675;background:#f2f7fd;padding:4px 9px;border-radius:6px;line-height:1.45;font-size:12px!important}
.selection-chip:hover{background:#f8ecf2;border-color:#e4bdd0}
.selection-actions{margin-top:auto;padding-top:17px;display:grid;gap:6px}
.save,.copy,#detail-toggle{border:1px solid transparent;border-radius:8px;padding:10px 13px;font-size:14px!important;font-weight:670!important;line-height:1.45}
.save,#detail-toggle{background:#1448bd;color:#fff}
.save:hover:not(:disabled),#detail-toggle:hover{background:#0b379d}
.save span{padding-left:5px}.copy{background:#fff;color:#315271;border-color:#cfdae6}.copy:hover:not(:disabled){background:#f2f7fc}
#gallery-status{font-size:12px;color:#5c5276;word-break:break-word;margin:5px 0 -5px}
#gallery-status:empty{margin:0}
.catalog{margin-top:clamp(32px,5vw,60px)}
.catalog h2{font-size:clamp(26px,3vw,33px);letter-spacing:-.06em}
.catalog h2 small{vertical-align:top;display:inline-block;margin:2px 0 0 3px;color:#3874af;font-size:14px;letter-spacing:0;padding:3px 8px;border:1px solid #c3d7e9;border-radius:999px}
.catalog-intro p{margin:6px 0 0;font-size:14px}
.bulk,.filters{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.bulk{justify-content:flex-end}
.bulk button,.filter-button{border:1px solid #c3d3e2;padding:6px 11px;border-radius:6px;background:#fff;color:#3b5470;font-size:13px!important;white-space:nowrap}
.bulk button:hover,.filter-button:hover{background:#e9f2fc}
.filters{margin:21px 0 13px}
.filter-button{border-radius:999px;padding:7px 14px}
.filter-button[aria-pressed=true]{background:#1c3c67;color:#fff;border-color:#1c3c67}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.robot-card{overflow:hidden;min-width:0;border:1px solid #ccd8e4;border-radius:11px;background:#fff}
.robot-card.selected,.robot-card.is-selected{border-color:#5c88d4;box-shadow:0 0 0 1px #5c88d44a}
.card-art{position:relative;background:#e5effb;aspect-ratio:372/196;border-bottom:1px solid #d3deec}
.card-art img{display:block;width:100%;height:100%;object-fit:contain}
.view-motion{position:absolute;bottom:9px;right:9px;border:1px solid #a8c0d9;color:#1b436f;background:#f7fbfff0;border-radius:999px;font-size:12px!important;font-weight:640!important;line-height:1.4;padding:4px 11px}
.view-motion:hover{background:#fff;border-color:#527caf}
.card-content{padding:12px 14px 14px}
.card-choice{display:flex;align-items:center;gap:6px;cursor:pointer;color:#193557}
.card-choice input{accent-color:#154cb8;margin:0 4px 0 0;width:17px;height:17px;flex:none;cursor:pointer}
.robot-number{font-size:13px;line-height:1.5;color:#446e9b;letter-spacing:0;font-variant-numeric:tabular-nums}
.card-name{font-size:17px;font-weight:715;line-height:1.4;letter-spacing:-.052em}
.card-sensor{display:inline-block;margin:8px 0 0;padding:2px 7px;background:#f0f5fb;color:#416182;border-radius:4px;font-size:12px;font-weight:650}
.card-task{color:#536780;font-size:13px;line-height:1.55;margin:6px 0 0;word-break:keep-all}
dialog#detail{width:min(560px,calc(100% - 24px));max-height:92dvh;margin:auto;padding:0;border:1px solid #b9cbdf;border-radius:16px;color:#193557;box-shadow:0 18px 88px #0c23484a;background:white;font-family:inherit}
dialog::backdrop{background:#14264488}
.detail-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 19px}
#detail-close{border:1px solid #d0dce9;border-radius:50%;width:34px;height:34px;color:#3d5b7f;background:#f6f9fd;font-size:21px;line-height:1}
.detail-art{position:relative;aspect-ratio:372/196;background:#e7f1fb}
#detail-field{display:block;width:100%;height:100%}
#detail-play{position:absolute;right:10px;bottom:10px;background:#f9fcffef;border:1px solid #aac1db;border-radius:999px;color:#294f7b;padding:4px 11px;font-size:12px}
.detail-caption{padding:16px 20px 20px}.detail-caption p{font-size:15px;line-height:1.5;margin:6px 0}.detail-caption #detail-info{font-size:13px;color:#275a8b;font-weight:650}.detail-caption #detail-effect{font-size:14px;color:#52667f}.detail-caption #detail-toggle{margin-top:12px;width:100%}
@media(max-width:830px){.workspace{grid-template-columns:minmax(0,1.85fr) minmax(208px,.9fr)}.selection{min-height:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.selection-hint{font-size:13px}.selection h2{font-size:18px}.selection-actions{padding-top:9px}}
@media(max-width:860px){.workspace{display:block}.selection{margin-top:12px;padding:16px}.selection-hint{margin:7px 0}.selection-actions{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.catalog-intro{align-items:start;flex-direction:column;gap:10px}.bulk{justify-content:start}.filters{margin-top:13px}.opening{margin-bottom:16px}.opening p{font-size:14px}.page-controls{margin-bottom:6px}.workbench{padding-left:14px;padding-right:14px}}
@media(max-width:520px){.grid{gap:8px}.card-content{padding:8px}.card-choice{gap:4px;align-items:baseline;flex-wrap:wrap}.card-choice input{align-self:center;margin:0;width:15px;height:15px}.card-name{font-size:14px}.robot-number{font-size:11px}.card-task{font-size:12px}.card-sensor{font-size:11px}.view-motion{right:5px;bottom:4px;font-size:10px!important;padding:3px 6px}.filter-button{font-size:12px!important;padding:5px 9px}.selection-actions .save,.selection-actions .copy{font-size:12px!important;padding:8px}.workspace .hero{aspect-ratio:8/7}}
@media(max-width:355px){.grid{grid-template-columns:1fr}}

.return-preview{display:inline-block;text-decoration:underline;text-underline-offset:4px;color:#275ea6;font-weight:650;font-size:14px;margin-top:18px}
</style></head>

<script>/* Small orthographic renderer for opaque mechanical assemblies. Every covered
   sample carries its own depth; face submission order never substitutes for it. */
class DepthView {
  constructor(supersample = 1.6) {
    this.samples = typeof supersample === 'number' ? supersample : 1.6;
    this.surfaces = new WeakMap();
    this.materials = new Map();
    this.circles = new Map();
  }

  ring(count) {
    if (!this.circles.has(count)) {
      const circle = [];
      for (let i = 0; i < count; i++) {
        const a = i * Math.PI * 2 / count;
        circle.push([Math.cos(a), Math.sin(a)]);
      }
      this.circles.set(count, circle);
    }
    return this.circles.get(count);
  }

  rgb(color) {
    if (!this.materials.has(color)) {
      let s = color.replace('#','');
      if (s.length === 3) s = s.split('').map(c=>c+c).join('');
      const n = parseInt(s,16);
      this.materials.set(color, [n>>16 & 255,n>>8 & 255,n & 255]);
    }
    return this.materials.get(color);
  }

  surface(model, width, height) {
    let s = this.surfaces.get(model);
    if (!s || s.w < width || s.h < height) {
      const canvas = s ? s.canvas : document.createElement('canvas');
      const w = Math.max(s ? s.w : 0, Math.ceil(width/16)*16);
      const h = Math.max(s ? s.h : 0, Math.ceil(height/16)*16);
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      const data = ctx.createImageData(w,h);
      s = {canvas,ctx,w,h,data,
        colors:new Uint32Array(data.data.buffer,data.data.byteOffset,w*h),
        depths:new Float32Array(w*h)};
      this.surfaces.set(model,s);
    }
    return s;
  }

  paint(ctx, cx, cy, unit, model, pose = {}) {
    const heading = pose.heading || 0;
    const cos = Math.cos(heading), sin = Math.sin(heading);
    const scale = pose.scale == null ? 1 : pose.scale;
    const ratio = ctx.getTransform ? Math.abs(ctx.getTransform().a) || 1 : 1;
    const aa = Math.max(1, Math.min(2.35, this.samples * ratio));
    const pixels = unit * scale * aa;
    // Horizontal, down, and viewer-facing axes expressed in local coordinates.
    const rx = (.81*cos + .586*sin)*pixels, rz = (.81*sin - .586*cos)*pixels;
    const dx = (.270*cos - .374*sin)*pixels, dz = (.270*sin+.374*cos)*pixels;
    const vx = .519782*cos-.718470*sin, vz = .519782*sin+.718470*cos;
    const vy = .461160;
    const lx = -.34*cos-.48*sin, lz = -.34*sin+.48*cos;
    const project = v => [
      rx*v[0]+rz*v[2], dx*v[0]-.887*pixels*v[1]+dz*v[2],
      vx*v[0]+vy*v[1]+vz*v[2]
    ];
    const triangles = [];
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    const addFace=(verts,indices,color,twoSided=false)=>{
      const first=verts[indices[0]], second=verts[indices[1]], third=verts[indices[2]];
      const ux=second[0]-first[0],uy=second[1]-first[1],uz=second[2]-first[2];
      const wx=third[0]-first[0],wy=third[1]-first[1],wz=third[2]-first[2];
      let nx=uy*wz-uz*wy,ny=uz*wx-ux*wz,nz=ux*wy-uy*wx;
      const facing=nx*vx+ny*vy+nz*vz;
      if (!twoSided && facing < 0) return;
      const norm=Math.hypot(nx,ny,nz);
      if (norm<1e-10) return;
      const inv=(facing<0?-1:1)/norm;
      nx*=inv; ny*=inv; nz*=inv;
      const diffuse=Math.max(0,nx*lx+ny*.808+nz*lz);
      const sky=.045*Math.max(0,ny);
      const shade=.722+.295*diffuse+sky;
      const rgb=this.rgb(color);
      const r=Math.min(255,Math.round(rgb[0]*shade));
      const g=Math.min(255,Math.round(rgb[1]*(shade+.012)));
      const b=Math.min(255,Math.round(rgb[2]*(shade+.022)));
      const packed=((255<<24)|(b<<16)|(g<<8)|r)>>>0;
      const face=indices.map(i=>{
        const vertex=verts[i];
        const pt=vertex.screen || (vertex.screen=project(vertex));
        minX=Math.min(minX,pt[0]); maxX=Math.max(maxX,pt[0]);
        minY=Math.min(minY,pt[1]); maxY=Math.max(maxY,pt[1]);
        return pt;
      });
      for(let i=1;i<face.length-1;i++) triangles.push(face[0],face[i],face[i+1],packed);
    };
    // Vertices are private per paint; callers may retain and reuse input arrays.
    const geom={
      face:(points,color)=>{
        if(points.length<3)return;
        const verts=points.map(v=>[v[0],v[1],v[2]]);
        addFace(verts,verts.map((_,i)=>i),color,true);
      },
      box:(center,size,color)=>{
        const [x,y,z]=center;
        const a=size[0]/2,b=size[1]/2,c=size[2]/2;
        const verts=[
          [x-a,y-b,z-c],[x+a,y-b,z-c],[x+a,y+b,z-c],[x-a,y+b,z-c],
          [x-a,y-b,z+c],[x+a,y-b,z+c],[x+a,y+b,z+c],[x-a,y+b,z+c]
        ];
        for(const f of DepthView.boxFaces) addFace(verts,f,color);
      },
      cyl:(a,b,r,color,sides=12)=>{
        const ring=this.ring(Math.max(3,Math.min(96,Math.round(sides))));
        let nx=b[0]-a[0],ny=b[1]-a[1],nz=b[2]-a[2];
        const length=Math.hypot(nx,ny,nz);
        if(length<1e-8 || r<=0)return;
        nx/=length; ny/=length; nz/=length;
        // u, v, axis form a right-handed basis, including vertical cylinders.
        let ux,uy,uz;
        if(Math.abs(ny)<.84){ux=-nz;uy=0;uz=nx;}else{ux=0;uy=nz;uz=-ny;}
        const inv=1/Math.hypot(ux,uy,uz);
        ux*=inv;uy*=inv;uz*=inv;
        const tx=ny*uz-nz*uy,ty=nz*ux-nx*uz,tz=nx*uy-ny*ux;
        const verts=[],start=[],end=[];
        for(const [cs,sn] of ring){
          const px=r*(ux*cs+tx*sn),py=r*(uy*cs+ty*sn),pz=r*(uz*cs+tz*sn);
          start.push(verts.length);verts.push([a[0]+px,a[1]+py,a[2]+pz]);
          end.push(verts.length);verts.push([b[0]+px,b[1]+py,b[2]+pz]);
        }
        for(let i=0;i<ring.length;i++){
          const j=(i+1)%ring.length;
          addFace(verts,[start[i],start[j],end[j],end[i]],color);
        }
        addFace(verts,end,color);
        addFace(verts,start.reverse(),color);
      },
      ball:(center,radii,color,sides=12)=>{
        if(typeof radii==='number')radii=[radii,radii,radii];
        const ring=this.ring(Math.max(6,Math.min(48,Math.round(sides))));
        const n=ring.length,levels=Math.max(4,Math.round(n/2)),verts=[];
        const [x,y,z]=center,[a,b,c]=radii;
        verts.push([x,y+b,z]);
        for(let j=1;j<levels;j++){
          const lat=Math.PI*j/levels, rr=Math.sin(lat);
          for(const [cs,sn] of ring)verts.push([x+a*rr*cs,y+b*Math.cos(lat),z+c*rr*sn]);
        }
        const bottom=verts.length;verts.push([x,y-b,z]);
        for(let i=0;i<n;i++){
          const k=(i+1)%n;
          addFace(verts,[0,1+k,1+i],color);
          for(let j=0;j<levels-2;j++){
            const off=1+j*n;
            addFace(verts,[off+i,off+k,off+n+k,off+n+i],color);
          }
          const last=1+(levels-2)*n;
          addFace(verts,[last+i,last+k,bottom],color);
        }
      }
    };
    model(geom,pose);
    if(!triangles.length)return;
    const left=Math.floor(minX)-2,top=Math.floor(minY)-2;
    const width=Math.ceil(maxX)-left+3,height=Math.ceil(maxY)-top+3;
    const surface=this.surface(model,width,height);
    // Bilinear sampling may read a texel outside the active source rectangle.
    // Clear the complete reusable surface so old silhouettes never leak into an edge.
    surface.colors.fill(0);
    surface.depths.fill(-Infinity,0,height*surface.w);
    for(let i=0;i<triangles.length;i+=4){
      this.triangle(surface,triangles[i],triangles[i+1],triangles[i+2],triangles[i+3],left,top);
    }
    surface.ctx.putImageData(surface.data,0,0);
    ctx.drawImage(surface.canvas,0,0,width,height,cx+left/aa,cy+top/aa,width/aa,height/aa);
  }

  triangle(s,a,b,c,color,left,top) {
    if(a[1]>b[1]){const t=a;a=b;b=t;}
    if(b[1]>c[1]){const t=b;b=c;c=t;}
    if(a[1]>b[1]){const t=a;a=b;b=t;}
    const x0=a[0]-left,y0=a[1]-top,x1=b[0]-left,y1=b[1]-top,x2=c[0]-left,y2=c[1]-top;
    const dy01=y1-y0,dy12=y2-y1,dy02=y2-y0;
    const area=(x1-x0)*dy02-(x2-x0)*dy01;
    if(Math.abs(area)<1e-8 || dy02<1e-8)return;
    const dzdx=((b[2]-a[2])*dy02-(c[2]-a[2])*dy01)/area;
    const dzdy=((x1-x0)*(c[2]-a[2])-(x2-x0)*(b[2]-a[2]))/area;
    const e02=(x2-x0)/dy02,e01=dy01>1e-9?(x1-x0)/dy01:0,e12=dy12>1e-9?(x2-x1)/dy12:0;
    const last=Math.ceil(y2-.5);
    const depths=s.depths,colors=s.colors;
    for(let row=Math.ceil(y0-.5);row<last;row++){
      const yy=row+.5;
      const xA=x0+(yy-y0)*e02;
      const xB=yy<y1?x0+(yy-y0)*e01:x1+(yy-y1)*e12;
      const lo=Math.ceil(Math.min(xA,xB)-.500001),hi=Math.floor(Math.max(xA,xB)-.499999);
      let z=a[2]+(lo+.5-x0)*dzdx+(yy-y0)*dzdy;
      const end=row*s.w+hi;
      for(let j=row*s.w+lo;j<=end;j++,z+=dzdx) {
        // Repainting a coplanar insignia is allowed; separated surfaces are tested geometrically.
        if(z>=depths[j]-.000001){depths[j]=z;colors[j]=color;}
      }
    }
  }
}
DepthView.boxFaces=[[0,3,2,1],[4,5,6,7],[0,4,7,3],[1,2,6,5],[0,1,5,4],[3,7,6,2]];


/* Robot geometry. Axles follow local x, forward is +z, and dimensions are metres. */
const robotPaint = {
  ivory:'#f6f4f1', frost:'#cfdef3', blue:'#0b91ea', cobalt:'#2153c7', trim:'#76afd2',
  rubber:'#293d49', graphite:'#193748', frame:'#345466', hub:'#b6cbdf',
  glass:'#123444', optic:'#7ad1fb', pink:'#c26093', blush:'#eca4bf'
};

// Keep every surface normal outward, including mirror-image left/right parts.
function robotFace(g, vertices, interior, paint) {
  const [a,b,c]=vertices;
  const ab=[b[0]-a[0],b[1]-a[1],b[2]-a[2]], ac=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
  const normal=[ab[1]*ac[2]-ab[2]*ac[1],ab[2]*ac[0]-ab[0]*ac[2],ab[0]*ac[1]-ab[1]*ac[0]];
  const outward=normal[0]*(a[0]-interior[0])+normal[1]*(a[1]-interior[1])+normal[2]*(a[2]-interior[2]);
  g.face(outward<0?vertices.slice().reverse():vertices,paint);
}

// Chamfered shell with a slightly sloped upper shoulder and a flat service cover.
function robotShell(g, c, dims, corner, paint, topPaint, slope=.055) {
  const [w,h,l]=dims, [x,y,z]=c;
  function ring(width,length,height,clip) {
    const a=width/2,b=length/2,d=Math.min(clip,a*.75,b*.75);
    return [[a,b-d],[a,-b+d],[a-d,-b],[-a+d,-b],[-a,-b+d],[-a,b-d],[-a+d,b],[a-d,b]]
      .map(([i,k])=>[x+i,height,z+k]);
  }
  const low=ring(w,l,y-h/2,corner),mid=ring(w,l,y+h/2-slope,corner);
  const lid=ring(w-slope*1.39,l-slope*1.39,y+h/2,Math.max(corner*.75,.01));
  robotFace(g,low,c,paint);robotFace(g,lid,c,topPaint);
  for(let i=0;i<8;i++){
    const j=(i+1)%8;
    robotFace(g,[low[i],low[j],mid[j],mid[i]],c,paint);
    robotFace(g,[mid[i],mid[j],lid[j],lid[i]],c,topPaint);
  }
}

function researchWheel(g,x,z,side,phase) {
  const p=robotPaint, y=.34, seg=16;
  const stations=[[-.143,.293],[-.094,.34],[.094,.34],[.143,.293]];
  const surface=stations.map(([dx,r])=>Array.from({length:seg},(_,i)=>{
    const a=phase+2*Math.PI*i/seg;
    return [x+dx,y+r*Math.cos(a),z+r*Math.sin(a)];
  }));
  const inter=[x,y,z];
  robotFace(g,surface[0],inter,p.rubber);robotFace(g,surface[3],inter,p.rubber);
  for(let row=0;row<3;row++){
    for(let i=0;i<seg;i++){
      const j=(i+1)%seg;
      const tread=row===1?(i%2?'#344d5b':'#293c48'):(i%2?'#384c59':'#30434f');
      robotFace(g,[surface[row][i],surface[row][j],surface[row+1][j],surface[row+1][i]],inter,tread);
    }
  }
  const faceX=x+side*.149,capX=x+side*.168;
  g.cyl([faceX-side*.015,y,z],[capX,y,z],.211,p.hub,14);
  // Three contrasting slotted spokes, a bright index mark, and one pink valve per tire.
  const outer=capX+side*.003;
  function patch(r0,r1,angle,width,color,x0=outer) {
    const loc=(r,a)=>[x0,y+r*Math.cos(a),z+r*Math.sin(a)];
    robotFace(g,[loc(r0,angle-width),loc(r1,angle-width*.67),loc(r1,angle+width*.67),loc(r0,angle+width)],inter,color);
  }
  for(let i=0;i<3;i++)patch(.048,.184,phase+i*Math.PI*2/3,.38,i===0?'#b75188':p.graphite);
  patch(.218,.292,phase+.08,.17,p.ivory,faceX);
  patch(.219,.28,phase+2.47,.12,p.pink,faceX);
  g.cyl([capX,y,z],[capX+side*.029,y,z],.067,p.frame,8);
}

function wheelRover(g,pose) {
  const p=robotPaint,wheel=pose.wheel||0;
  // The hubs remain on the axle. All visible tread, spokes and valve markers rotate.
  for(const side of [-1,1]) for(const end of [-1,1]){
    const z=end*.715;
    g.cyl([side*.36,.34,z],[side*.70,.34,z],.071,p.frame,8);
    const sidePhase=pose.wheelBySide?pose.wheelBySide[side>0?1:0]:wheel;
    researchWheel(g,side*.68,z,side,sidePhase+(end>0?.37:0));
  }
  robotShell(g,[0,.47,0],[1.20,.22,1.91],.15,p.graphite,p.frame,.045);
  robotShell(g,[0,.695,.014],[1.22,.36,2.11],.19,p.cobalt,p.frost,.105);
  robotShell(g,[0,.861,-.06],[1.05,.10,1.69],.13,p.frost,p.ivory,.025);
  for(const side of [-1,1]){
    g.box([side*.614,.688,-.12],[.023,.048,.76],p.ivory);
    g.box([side*.616,.69,.429],[.024,.050,.137],p.pink);
  }
  // Stereo-camera visor and rear status lights are on physically separated plates.
  g.box([0,.662,1.077],[.75,.145,.060],p.graphite);
  for(const x of [-.222,.222]){
    g.cyl([x,.668,1.096],[x,.668,1.124],.045,p.optic,10);
    g.cyl([x,.668,1.125],[x,.668,1.135],.024,p.glass,8);
  }
  g.box([0,.586,-1.046],[.79,.059,.04],p.frame);
  for(const x of [-.30,.30])g.box([x,.587,-1.070],[.11,.046,.019],p.pink);
  // Spinning roof LiDAR with a glass optical band.
  g.cyl([0,.89,.145],[0,1.035,.145],.12,p.frame,12);
  g.cyl([0,1.035,.145],[0,1.082,.145],.253,p.hub,16);
  g.cyl([0,1.082,.145],[0,1.249,.145],.238,p.glass,16);
  g.cyl([0,1.249,.145],[0,1.300,.145],.25,p.ivory,16);
  for(let j=0;j<5;j++)g.box([.197,.924,-.641+j*.067],[.282,.022,.027],p.trim);
  g.cyl([-.43,.875,-.65],[-.43,1.011,-.65],.053,p.frame,8);
  g.cyl([-.43,1.01,-.65],[-.43,1.48,-.65],.022,p.graphite,8);
  g.cyl([-.43,1.445,-.65],[-.43,1.48,-.65],.024,p.pink,8);
}

function quadrupedHeight(pose) {
  const stride=pose.stride==null?1:pose.stride;
  return .866+.015*Math.sin((pose.gait||0)*2)*stride;
}
function inspectionOpticPoint(pose,x,y,z) {
  // The paired trunnions let the camera pitch toward the cabinet's dial.
  const pitch=-.035-.235*(pose.inspect||0),cs=Math.cos(pitch),sn=Math.sin(pitch);
  return [x,quadrupedHeight(pose)+.175+y*cs+z*sn,.714-y*sn+z*cs];
}
function inspectionLens(pose) {
  return inspectionOpticPoint(pose,-.073,.012,.335);
}
function quadruped(g,pose) {
  const p=robotPaint,gait=pose.gait||0,stride=pose.stride==null?1:pose.stride;
  const torsoY=quadrupedHeight(pose);
  const hub=(pt,side,r,cap)=>{
    g.cyl([pt[0]-.066,pt[1],pt[2]],[pt[0]+.066,pt[1],pt[2]],r,p.frame,10);
    const x=pt[0]+side*.078;
    g.cyl([x-side*.014,pt[1],pt[2]],[x,pt[1],pt[2]],r*.64,cap,8);
  };
  for(const side of [-1,1]) for(const end of [-1,1]){
    const phase=gait+(side===end?0:Math.PI);
    const hip=[side*.273,torsoY+.012,end*.475];
    const foot=[side*.365,.055+.145*stride*Math.max(0,Math.cos(phase)),end*.520+.224*stride*Math.sin(phase)];
    // Solve sagittal-plane two-link leg IK to keep each stance foot at floor height.
    const dz=foot[2]-hip[2],dy=foot[1]-hip[1],d=Math.max(.01,Math.hypot(dz,dy));
    const upper=.439,lower=.467;
    const along=(upper*upper-lower*lower+d*d)/(2*d);
    const across=Math.sqrt(Math.max(0,upper*upper-along*along));
    const bend=end>0?-1:1;
    const knee=[side*.355,hip[1]+along*dy/d+bend*across*dz/d,hip[2]+along*dz/d-bend*across*dy/d];
    g.cyl(hip,knee,.081,p.blue,7);
    const h=[hip[0]+(knee[0]-hip[0])*.15,hip[1]+(knee[1]-hip[1])*.15,hip[2]+(knee[2]-hip[2])*.15];
    const k=[hip[0]+(knee[0]-hip[0])*.64,hip[1]+(knee[1]-hip[1])*.64,hip[2]+(knee[2]-hip[2])*.64];
    g.cyl(h,k,.099,p.frost,7);
    g.cyl(knee,foot,.044,p.graphite,7);
    hub(hip,side,.126,p.hub);hub(knee,side,.082,p.trim);
    robotShell(g,[foot[0],foot[1],foot[2]+.022],[.138,.103,.24],.043,p.rubber,p.frame,.028);
  }
  robotShell(g,[0,torsoY,0],[.547,.346,1.40],.119,p.cobalt,p.blue,.061);
  robotShell(g,[0,torsoY+.172,-.065],[.493,.079,1.11],.10,p.frost,p.ivory,.027);
  g.box([0,torsoY+.168,.431],[.391,.061,.158],p.blush);
  for(const s of [-1,1]){
    for(let i=0;i<3;i++)g.box([s*.278,torsoY+.017,-.286+.132*i],[.017,.062,.069],p.glass);
  }
  // A two-sided gimbal carries a forward optical instrument, independently
  // pitched about its horizontal axis as the body comes to a stop.
  g.cyl([0,torsoY+.012,.515],[0,torsoY+.14,.692],.112,p.frame,8);
  const head=(x,y,z)=>inspectionOpticPoint(pose,x,y,z);
  for(const side of [-1,1]){
    g.cyl([side*.222,torsoY+.175,.714],[side*.258,torsoY+.175,.714],.081,p.graphite,10);
    g.cyl([side*.256,torsoY+.175,.714],[side*.264,torsoY+.175,.714],.048,p.pink,10);
  }
  // Octagonal section across the camera shell with wide, dark front visor.
  const contour=[[-.184,-.131],[.184,-.131],[.215,-.090],[.215,.083],[.165,.137],[-.165,.137],[-.215,.083],[-.215,-.09]];
  const rear=contour.map(([x,y])=>head(x*.89,y*.9,-.09));

/* Macro base station. Local world axes are [x, height, z]. */
function baseStation(g, pose) {
  const steel = '#486b84';
  const steelLight = '#7d9aaa';
  const rail = '#91adbb';
  const dark = '#3f5c72';
  const panelWhite = '#f2f5ed';
  const radioShell = '#c8d5d8';
  const bolts = '#687f8a';
  const cable = '#3e5968';
  const twoPi = Math.PI * 2;

  function strut(a, b, radius, color, sides = 5) {
    g.cyl(a, b, radius, color, sides);
  }
  function radial(angle, distance, y, across = 0) {
    return [
      Math.sin(angle) * distance + Math.cos(angle) * across,
      y,
      Math.cos(angle) * distance - Math.sin(angle) * across
    ];
  }

  // A concrete pad and three raised, bolted footings anchor the steelwork.
  g.box([0,.075,0], [1.35,.15,1.27], '#b4c6cc');
  g.box([0,.16,0], [1.24,.045,1.17], '#d8e3df');
  const footRadius = .50;
  const shoulderRadius = .125;
  const footY = .22;
  const platformY = 2.64;
  const strandAngles = [.11, .11 + twoPi/3, .11 + 2*twoPi/3];
  function leg(angle, y) {
    const u = (y-footY)/(platformY-footY);
    return radial(angle, footRadius+(shoulderRadius-footRadius)*u, y);
  }
  for (const a of strandAngles) {
    const foot = leg(a,footY);
    g.box([foot[0],.202,foot[2]],[.20,.047,.20],steel);
    for (const offset of [-.062,.062]) {
      g.box([foot[0]+offset,.232,foot[2]+.058],[.027,.025,.027],bolts);
    }
    strut(foot,leg(a,platformY),.042,steel,7);
  }
  const bays = [footY,.87,1.49,2.10,platformY];
  for (let bay=0;bay<bays.length-1;bay++) {
    const lower=bays[bay], upper=bays[bay+1];
    for (let j=0;j<3;j++) {
      const a=strandAngles[j],b=strandAngles[(j+1)%3];
      strut(leg(a,lower),leg(b,upper),.020,steelLight,4);
      strut(leg(b,lower),leg(a,upper),.016,steel,4);
      strut(leg(a,upper),leg(b,upper),.022,steelLight,5);
    }
  }

  // Along the rear face a little fixed-access ladder parallels the lattice.
  const ladderBottom = -.326;
  const ladderTop = -.12;
  function ladderZ(y) { return ladderBottom+(ladderTop-ladderBottom)*(y-.26)/2.36; }
  for (const side of [-.078,.078]) {
    strut([side,.26,ladderZ(.26)],[side,2.62,ladderZ(2.62)],.013,rail);
  }
  for (let rung=0;rung<10;rung++) {
    const y=.32+rung*.228;
    strut([-.078,y,ladderZ(y)],[.078,y,ladderZ(y)],.012,rail,4);
  }

  // The radio head has three separate sectors at 120-degree azimuth intervals.
  g.cyl([0,2.59,0],[0,2.67,0],.27,steelLight,9);
  g.cyl([0,2.64,0],[0,3.65,0],.047,steel,8);
  strut([0,3.62,0],[0,3.90,0],.014,steelLight,6);

  function antennaPanel(azimuth, lane) {
    // Eight corners give the weatherproof radome a narrow chamfer.
    const outline=[
      [-.089,-.422],[.089,-.422],[.116,-.391],[.116,.392],
      [.089,.426],[-.089,.426],[-.116,.392],[-.116,-.391]
    ];
    const cy=3.145;
    function rim(distance, scale) {
      return outline.map(([x,y])=>radial(azimuth,distance,cy+y*scale,lane+x*scale));
    }
    const rear=rim(.430,1),lip=rim(.508,1),front=rim(.535,.949);
    g.face(rear.slice().reverse(),steelLight);
    for (let i=0;i<outline.length;i++){
      const j=(i+1)%outline.length;
      g.face([rear[i],rear[j],lip[j],lip[i]],radioShell);
      g.face([lip[i],lip[j],front[j],front[i]],'#e6ece7');
    }
    g.face(front,panelWhite);
    // Lower connector block with a weatherproof coax/service loop behind it.
    const connector=radial(azimuth,.446,2.710,lane);
    const turn=radial(azimuth,.430,2.577,lane+.015);
    const entry=radial(azimuth,.255,2.55,lane+.025);
    strut(connector,turn,.013,cable);
    strut(turn,entry,.013,cable);
  }
  for (const a of [.35,.35+twoPi/3,.35+2*twoPi/3]) {
    for (const y of [2.91,3.39]) {
      strut(radial(a,.035,y),radial(a,.406,y),.029,steel,6);
      strut(radial(a,.405,y,-.22),radial(a,.405,y,.22),.020,steelLight,5);
    }
    antennaPanel(a,-.125);
    antennaPanel(a,.125);
  }

  // A small parabolic microwave radio is mounted below the sector arrays.
  // A shallow dish and a feed horn give it a recognizable side profile.
  const dishAzimuth=1.12;
  const dishHeight=2.18;
  const dishRadius=.221;
  function dishPoint(depth, angle, radius) {
    return radial(dishAzimuth,depth,dishHeight+radius*Math.sin(angle),radius*Math.cos(angle));
  }
  strut(radial(dishAzimuth,.07,dishHeight),radial(dishAzimuth,.39,dishHeight),.044,steel,6);
  const inner=[],rim=[],back=[];
  for(let i=0;i<14;i++){
    const a=twoPi*i/14;
    inner.push(dishPoint(.441,a,dishRadius*.51));
    rim.push(dishPoint(.496,a,dishRadius));
    back.push(dishPoint(.475,a,dishRadius*.99));
  }
  const center=radial(dishAzimuth,.425,dishHeight);
  const hub=radial(dishAzimuth,.376,dishHeight);
  for(let i=0;i<rim.length;i++){
    const j=(i+1)%rim.length;
    g.face([center,inner[i],inner[j]],'#e5eceb');
    g.face([inner[i],rim[i],rim[j],inner[j]],'#d8e4e7');
    g.face([rim[i],back[i],back[j],rim[j]],steelLight);
    g.face([hub,back[j],back[i]],'#859eac');
  }
  strut(radial(dishAzimuth,.433,dishHeight),radial(dishAzimuth,.57,dishHeight),.010,cable);
  strut(radial(dishAzimuth,.551,dishHeight),radial(dishAzimuth,.581,dishHeight),.029,radioShell,8);

  // Baseband / power cabinet mounted against one edge of the base slab.
  g.box([-.408,.409,.210],[.315,.458,.355],'#c4d5db');
  g.box([-.408,.652,.210],[.342,.038,.382],'#e0e8e7');
  g.box([-.405,.425,.393],[.268,.364,.014],'#deeaeb');
  g.box([-.31,.430,.404],[.015,.064,.012],dark);
  for(let i=0;i<3;i++) {
    g.box([-.414,.300+i*.027,.404],[.141,.009,.006],steelLight);
  }

  // A separate equipment pad leaves the tower footings visible from the front.
  const rackX=1.54, rackZ=-.59, faceZ=rackZ+.202;
  g.box([rackX,.09,rackZ],[.92,.18,.53],'#b9cbd1');
  const port=leg(strandAngles[1],.46);
  g.box(port,[.115,.13,.12],dark);
  const lead=[port,[.53,.27,-.25],[.65,.14,-.25],[.79,.095,-.26],
              [.89,.089,-.27],[.98,.12,-.29],[1.05,.21,-.32],
              [rackX-.369,.27,faceZ+.039]];
  for(let i=1;i<lead.length;i++)strut(lead[i-1],lead[i],.024,cable,7);
  g.box(lead[lead.length-1],[.082,.067,.074],dark);
  g.box([rackX,.674,rackZ],[.86,.99,.372],'#7e949f');
  g.box([rackX,1.175,rackZ],[.88,.055,.40],'#d1dde0');
  g.box([rackX,.687,faceZ-.013],[.812,.899,.035],'#233d51');
  for(let i=0;i<3;i++){
    const y=.396+i*.283;
    g.box([rackX,y,faceZ+.019],[.747,.236,.043],'#516c7d');
    g.box([rackX-.134,y,faceZ+.045],[.36,.152,.015],'#263c4d');
    for(let k=0;k<5;k++)
      g.box([rackX-.268+k*.068,y,faceZ+.057],[.026,.12,.009],'#8196a2');
    for(const dx of [.118,.211])
      g.box([rackX+dx,y+.009,faceZ+.046],[.074,.073,.012],'#172e3e');
    g.box([rackX+.309,y+.032,faceZ+.049],[.038,.048,.017],'#92ecd0');
  }

}

/* Three independent field assignments, in metre-scale ground coordinates. */
const missionTau=2*Math.PI;
const missionDuration=24;
const missionRight={x:.810194786,z:-.586160740};
const missionDepth={x:.586160740,z:.810194786};
const missionSideYaw=Math.atan2(missionRight.x,missionRight.z);
const missionClip=v=>Math.max(0,Math.min(1,v));
const missionSmooth=v=>{const p=missionClip(v);return p*p*(3-2*p);};
const missionGate=(v,a,b,edge)=>missionSmooth((v-a)/edge)*missionSmooth((b-v)/edge);
const missionTime=(t,offset=0)=>((t+offset)%missionDuration+missionDuration)%missionDuration;
function missionGround(scene,base,side,depth,height=0){
  return scene.project(base,side*missionRight.x+depth*missionDepth.x,height,
                            side*missionRight.z+depth*missionDepth.z);
}

// A single rounded connector joins the parallel survey traverses at each end.
// Four complete hub revolutions along the centreline also make each side close
// exactly at 24 s, including its separate inner/outer turning distance.
const surveyScale=.94, surveyRadius=.51;
const surveyWheelRadius=.34*surveyScale;
const surveyLength=Math.PI*(4*surveyWheelRadius-surveyRadius);
const surveyHalf=surveyLength/2;
const surveyDepth=1.64;
const surveyProjection=(scene,s,d,h=0)=>missionGround(scene,scene.bugBase,s,d,h);
function surveyMission(scene,t){
  const now=missionTime(t,2.25);
  const pass=now>=12?1:0;
  const local=now-pass*12;
  const outbound=pass===0;
  const sign=outbound?1:-1;
  let side,depth,angle,distance;
  // Each pass has a long scan, a stationary end reading, a U-turn and a brief settle.
  const run=missionSmooth(local/7.8);
  const bend=missionSmooth((local-8.65)/3.05);
  if(local<8.65){
    side=sign*(-surveyHalf+surveyLength*run);
    depth=-sign*surveyRadius;
    angle=pass*Math.PI;
    distance=pass*(surveyLength+Math.PI*surveyRadius)+surveyLength*run;
  }else{
    const radians=bend*Math.PI;
    side=sign*(surveyHalf+surveyRadius*Math.sin(radians));
    depth=-sign*surveyRadius*Math.cos(radians);
    angle=pass*Math.PI+radians;
    distance=pass*(surveyLength+Math.PI*surveyRadius)+surveyLength+surveyRadius*radians;
  }
  const ground=surveyProjection(scene,side,depth);
  const target=surveyProjection(scene,side,-sign*surveyDepth,.018);
  const scan=missionGate(local,.06,8.59,.64);
  const heading=missionSideYaw-angle;
  const strip=outbound?'A':'B',next=outbound?'B':'A';
  const action=local<7.8?'Mapping strip '+strip:local<8.65?'Reading strip '+strip:
    local<11.70?'Turning to strip '+next:'Aligning to strip '+next;
  const left=(distance-.68*surveyScale*angle)/surveyWheelRadius;
  const right=(distance+.68*surveyScale*angle)/surveyWheelRadius;
  return {model:wheelRover,ground,origin:ground,scale:surveyScale,heading,
    wheel:distance/surveyWheelRadius,wheelBySide:[left,right],antenna:[-.43,1.48,-.65],
    scan,scanTarget:target,action,row:pass,progress:run,surveySide:side,surveyDepth:depth};
}

// The walking line approaches the front of a fixed field cabinet. Its slight
// angle presents both the panel and the inspection camera to the viewer.
const dogScale=1.04, cabinetScale=1.02;
const dogYaw=missionSideYaw+.38;
const walkSide=Math.cos(.38), walkDepth=-Math.sin(.38);
const dogTravel=1.52;
const cabinetStandOff=1.84;
const dogStart={s:-1.31,d:.42};
const dogPosition=(scene,distance)=>missionGround(scene,scene.dogBase,
  dogStart.s+distance*walkSide,dogStart.d+distance*walkDepth);
function missionFixtures(scene){
  const cabinetAxis=dogPosition(scene,dogTravel+cabinetStandOff);
  // Offset the cabinet for the off-centre camera and left-hand dial. At the
  // parked inspection pose the lens points 0.48 m forward and 0.15 m down.
  const cabinet=scene.project(cabinetAxis,-.173*Math.cos(dogYaw),0,.173*Math.sin(dogYaw));
  const heading=dogYaw+Math.PI;
  const cx=-.095,cz=.277,c=Math.cos(heading),s=Math.sin(heading);
  const gauge=scene.project(cabinet,(cx*c+cz*s)*cabinetScale,.835*cabinetScale,(-cx*s+cz*c)*cabinetScale);
  return {
    surveyRows:[-surveyDepth,surveyDepth].map(d=>[-surveyHalf-.14,surveyHalf+.14].map(side=>surveyProjection(scene,side,d,.012))),
    cabinet,cabinetGauge:gauge,cabinetHeading:heading,cabinetScale,
    dogHome:dogPosition(scene,0),dogHeading:dogYaw,plotHeading:0,padHeading:.35,
    pad:missionGround(scene,scene.airBase,1.01,.20),
    capturePlot:missionGround(scene,scene.airBase,-1.02,-.17)
  };
}
function inspectionMission(scene,t,fixtures){
  const now=missionTime(t,2.0);
  const round=missionTau;
  let dist=0,heading=dogYaw,stride=0,gait=0,inspect=0;
  // The head-on reading lasts longer than either transit, making the job clear.
  if(now<5.5){
    const f=now/5.5;
    dist=dogTravel*missionSmooth(f);
    gait=round*2.5*missionSmooth(f);
    stride=Math.sin(Math.PI*f);
  }else if(now<12.6){
    dist=dogTravel;gait=round*2.5;
    inspect=missionGate(now,5.55,12.54,1.0);
  }else if(now<14.25){
    // A short reverse step clears the cabinet before the robot turns.
    const f=(now-12.6)/1.65;
    dist=dogTravel-.30*missionSmooth(f);gait=round*(2.5-.5*missionSmooth(f));
    stride=.58*Math.sin(Math.PI*f);
  }else if(now<16.15){
    const f=(now-14.25)/1.90;
    dist=dogTravel-.30;heading+=Math.PI*missionSmooth(f);
    gait=round*(2+1.5*missionSmooth(f));stride=.45*Math.sin(Math.PI*f);
  }else if(now<21.4){
    const f=(now-16.15)/5.25;
    dist=(dogTravel-.30)*(1-missionSmooth(f));heading+=Math.PI;
    gait=round*(3.5+2*missionSmooth(f));stride=Math.sin(Math.PI*f);
  }else if(now<23.25){
    const f=(now-21.4)/1.85;
    heading+=Math.PI*(1-missionSmooth(f));
    gait=round*(5.5+1.5*missionSmooth(f));stride=.45*Math.sin(Math.PI*f);
  }else{
    gait=round*7;
  }
  const action=now<5.5?'Approaching gauge':now<12.6?'Reading gauge':
    now<14.25?'Clearing cabinet':now<21.4?'Returning to base':'At standby point';
  const ground=dogPosition(scene,dist);
  return {model:quadruped,ground,origin:ground,scale:dogScale,heading,gait,
    stride,inspect,action,target:fixtures.cabinetGauge,antenna:[0,1.26,-.43]};
}

// Smooth rotor spin-up and spin-down. The analytical integral makes the final
// blade orientation equal the first, without introducing a frame-time state.
function flightRotor(now){
  const start=.10,ramp=1.1,stop=22.85,end=stop+ramp;
  const integral=u=>u*u*u-.5*u*u*u*u;
  let elapsed;
  if(now<start)elapsed=0;
  else if(now<start+ramp)elapsed=ramp*integral((now-start)/ramp);
  else if(now<stop)elapsed=ramp*.5+now-start-ramp;
  else if(now<end){const x=(now-stop)/ramp;elapsed=stop-start-ramp*.5+ramp*(x-integral(x));}
  else elapsed=stop-start;
  return missionTau*64*elapsed/(stop-start);
}
function aerialMission(scene,t,fixtures){
  const now=missionTime(t,2.8);
  const lift=missionSmooth((now-.72)/3.25)*(1-missionSmooth((now-18.70)/3.42));
  const traverse=missionSmooth((now-2.8)/4.25)*(1-missionSmooth((now-14.56)/4.20));
  const side=1.01-2.03*traverse,depth=.20-.37*traverse;
  const linePoint=missionGround(scene,scene.airBase,side,depth);
  const heading=.35+.42*traverse,cam=.287*1.03*traverse;
  // Position the optical sensor, rather than the aircraft centre, directly above the surveyed tile.

    const shape=[[.025,-.020],[r*.30,-r*.065],[r,-r*.055],[r*.98,r*.035],[r*.30,r*.046],[.025,.014]];

      const b=at(r*u,r*v);b[vertical?2:1]+=.004;return b;}),awColors.pink);

  }
  const stations=specs.map((r,i)=>this.make(r,slots[i],t));
  this.lastBodies=stations.map(s=>s.p);
  // Shadows, physical props and measurements have distinct layering.
  for(const m of stations)this.floor(c,m,t);
  if(!this.detail){
   this.softShadow(c,fieldOffset(this.mast,.21*this.u,0),this.u*.94,this.u*.31,.31);
   if(this.showRadio)stations.forEach((m,i)=>{
    if(m.r.medium==='water'){
     const gw=fieldOffset(m.anchor,-1.36*this.u,-.83*this.u);m.gateway={model:waterGateway,origin:gw,ground:gw,heading:0,scale:1,antenna:[0,.54,0]};
     this.radio(c,m.gateway,i,t);
     this.line(c,[gw,m.source],'rgba(31,122,152,.55)',Math.max(.7,this.u*.016),[2,3]);
    }else this.radio(c,m.p,i,t,m.r.id==='01'&&ids.includes('13'));
   });
   const o=this.towerOffset;
   c.drawImage(this.towerCanvas,this.mast.x-o.x,this.mast.y-o.y,this.towerCanvas.width/this.dpr,this.towerCanvas.height/this.dpr);
  }
  // A measurement on the back survey strip is hidden correctly by the rover,
  // while a front-strip return and the other instruments stay above their targets.
  const rearSurvey=m=>m.r.id==='01'&&m.p.row===0;
  for(const m of stations)if(rearSurvey(m))this.drawMeasurement(c,m,t);
  const all=[];
  for(const m of stations){all.push(...m.props,m.p);if(m.gateway)all.push(m.gateway);}
  all.sort((a,b)=>a.ground.y-b.ground.y);
  for(const obj of all)this.renderer.paint(c,obj.origin.x,obj.origin.y,this.u,obj.model,obj);
  for(const m of stations)if(!rearSurvey(m))this.drawMeasurement(c,m,t);
 }
}

<script>/* Shared playback controller for the gallery preview and its self-contained export. */
(() => {
  const byId=id=>document.getElementById(id);
  const hero=byId('hero'), canvas=byId('field'), motion=byId('motion-toggle');
  const missions=byId('missions'), pager=byId('page-controls'), status=byId('preview-page');
  const previous=byId('prev-page'), next=byId('next-page'), empty=byId('empty-hero');
  if(!hero||!canvas)return;

  const html=document.documentElement;
  if(html.dataset.mode!=='picker' && new URLSearchParams(location.search).has('background'))html.classList.add('background-only');
  if(html.dataset.mode!=='picker' && window.top && window.top!==window.self)html.classList.add('embedded');

  const korean=(html.getAttribute('lang')||'en').toLowerCase().startsWith('ko');
  const preference=matchMedia('(prefers-reduced-motion: reduce)');
  const startTime=5.3, cycle=24;
  const field=new CandidateField(canvas);
  let ids=[], page=0, elapsed=0, playing=!preference.matches;
  let visible=true, ready=false, handle=null, lastTime=null, lastPaint=-Infinity;
  let lastWidth=0,lastHeight=0,lastRatio=0;
  const outputs=[];
  const names=[];
  const activeActions=[
    '', '', '', 'Locating hot bearing','Mapping terrain','Ranging obstacle','Sampling gas',
    'Imaging pipe crack','Inspecting seam','Scanning foliage','Profiling rail','Measuring snowpack',
    'Profiling workpiece','Locating part','Checking bore','Tracing test surface','Locating fork pockets',
    'Finding hot valve','Inspecting bolts','Aligning to marker','Locating sound','Mapping crops',
    'Scanning vegetation','Finding hot spots','Sampling air','Counting flowers','Sounding depth',
    'Scanning seabed','Inspecting pipe joint','Sampling temperature'
  ];
  const koreanCore={
    'Mapping strip A':'측량선 A 스캔','Mapping strip B':'측량선 B 스캔',
    'Reading strip A':'측량선 A 판독','Reading strip B':'측량선 B 판독',
    'Aligning to strip A':'측량선 A에 정렬','Aligning to strip B':'측량선 B에 정렬',
    'Turning to strip A':'측량선 A로 이동','Turning to strip B':'측량선 B로 이동',
    'Approaching gauge':'계기로 접근','Reading gauge':'계기 판독','Clearing cabinet':'제어함에서 후진',
    'Turning to return':'복귀 방향 전환','Returning to base':'대기점 복귀','At standby point':'대기점 정지',
    'Facing cabinet':'점검 방향 정렬','On landing pad':'착륙장 대기','Taking off':'이륙',
    'Flying to target':'표적 접근','Capturing target':'표적 촬영','Returning to pad':'착륙장 복귀',
    'Landing':'착륙'
  };
  function readRoster(){
    const stored=html.dataset.roster;
    if(stored==null||!stored.trim())return DEFAULT_IDS;
    if(stored.trim().startsWith('[')){
      try{const parsed=JSON.parse(stored);return Array.isArray(parsed)?parsed:DEFAULT_IDS;}catch(e){return DEFAULT_IDS;}
    }
    return stored.trim().split(/[,\s]+/);
  }
  function pages(){return Math.ceil(ids.length/4);}
  function group(){return ids.slice(page*4,page*4+4);}
  function makeCaptions(){
    if(!missions)return;
    missions.textContent='';outputs.length=0;names.length=0;
    for(const id of group()){
      const r=TYPES.get(id),dl=document.createElement('dl'),dt=document.createElement('dt'),dd=document.createElement('dd');
      dl.className='mission';dt.textContent=korean?r.name:r.en;
      dl.appendChild(dt);dl.appendChild(dd);missions.appendChild(dl);outputs.push(dd);names.push(r);
    }
    missions.hidden=!ids.length;
  }
  function refreshState(){
    if(empty)empty.hidden=!!ids.length;
    if(motion){
      const label=korean?(playing?'애니메이션 일시정지':'애니메이션 재생'):(playing?'Pause animation':'Play animation');
      motion.dataset.playing=String(playing);motion.setAttribute('aria-label',label);motion.title=label;motion.disabled=!ids.length;
    }
    if(previous)previous.disabled=pages()<2;
    if(next)next.disabled=pages()<2;
    if(pager)pager.hidden=pages()<2;
    if(status)status.textContent=pages()?(page+1)+' / '+pages():'0 / 0';
  }
  function paint(){
    if(!ready)return;
    field.draw((elapsed+startTime)%cycle);
    for(let i=0;i<outputs.length;i++){
      const r=names[i],pose=field.lastBodies[i];
      if(!pose)continue;
      let action=pose.action||'';
      if(!korean&&['01','03','13','18'].includes(r.id)){action=({'01':'Scanning stepped surfaces','03':'Surveying roof slopes','13':'Transferring workpiece','18':'Adjusting pipe valve'})[r.id];}else if(Number(r.id)<=3){
        if(korean)action=koreanCore[action]||action;
      }else if(!korean){
        if(action==='대상 접근')action='Approaching target';
        else if(action==='다음 측정 준비')action='Preparing next scan';
        else action=activeActions[Number(r.id)-1]||'Sensing target';
      }
      if(outputs[i].textContent!==action)outputs[i].textContent=action;
    }
  }
  function switchPage(index){
    const count=pages();
    page=count?Math.min(count-1,Math.max(0,Math.floor(Number(index)||0))):0;
    field.setPage(page);makeCaptions();refreshState();
  }
  function tick(now){
    handle=null;
    if(!playing||!visible||document.hidden||!ids.length||!ready)return;
    if(lastTime!==null){
      elapsed+=Math.max(0,(now-lastTime)/1000);
      const cycles=Math.floor(elapsed/cycle);
      if(cycles){
        elapsed%=cycle;
        if(pages()>1)switchPage((page+cycles)%pages());
      }
    }
    lastTime=now;
    if(now-lastPaint>=1000/30-1){paint();lastPaint=now;}
    handle=requestAnimationFrame(tick);
  }
  function schedule(){
    if(handle!==null)cancelAnimationFrame(handle);
    handle=null;lastTime=null;lastPaint=-Infinity;
    if(ready&&playing&&visible&&!document.hidden&&ids.length)handle=requestAnimationFrame(tick);
  }
  function setPage(index){
    switchPage(index);elapsed=0;paint();schedule();return page;
  }
  function setIds(roster,index=0){
    ids=cleanIds(Array.isArray(roster)?roster:[]);
    field.setIds(ids,index);
    return setPage(index);
  }
  function setPlaying(state){
    playing=!!state;refreshState();schedule();
  }
  function fit(){
    const rect=hero.getBoundingClientRect(),ratio=Math.min(1.65,window.devicePixelRatio||1);
    if(rect.width<=0||rect.height<=0){ready=false;schedule();return;}
    if(ready && Math.abs(rect.width-lastWidth)<.1 && Math.abs(rect.height-lastHeight)<.1 && ratio===lastRatio)return;
    lastWidth=rect.width;lastHeight=rect.height;lastRatio=ratio;
    field.resize(rect.width,rect.height,ratio);ready=true;paint();schedule();
  }
  if(motion)motion.addEventListener('click',()=>setPlaying(!playing));
  if(previous)previous.addEventListener('click',()=>{if(pages()>1)setPage((page-1+pages())%pages());});
  if(next)next.addEventListener('click',()=>{if(pages()>1)setPage((page+1)%pages());});
  const preferenceChanged=e=>setPlaying(!e.matches);
  if(preference.addEventListener)preference.addEventListener('change',preferenceChanged);
  else if(preference.addListener)preference.addListener(preferenceChanged);
  document.addEventListener('visibilitychange',schedule);
  if(typeof IntersectionObserver==='function')new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;schedule();}).observe(hero);
  if(typeof ResizeObserver==='function')new ResizeObserver(fit).observe(hero);
  else window.addEventListener('resize',fit);
  window.addEventListener('message',e=>{
    if(e.source===window.parent && e.origin===location.origin && e.data && e.data.type==='fizlab-motion' && typeof e.data.playing==='boolean')setPlaying(e.data.playing);
  });
  window.bannerPlayer={setIds,setPage,getPage:()=>page};
  window.fizlabFrame=t=>{
    setPlaying(false);
    elapsed=((Number(t)||0)-startTime+cycle)%cycle;
    if(elapsed<0)elapsed+=cycle;
    paint();
  };
  setIds(readRoster());fit();
})();
</script>

<script>/* Offline catalogue and selector. The exported document is a separate banner. */
(() => {
  const by=id=>document.getElementById(id);
  const grid=by('grid');
  if(!grid || !window.bannerPlayer)return;
  const player=window.bannerPlayer, key='fizlab.field-missions.robot-selection.four.v1';
  const groups=['전체','지상·현장','산업·서비스','항공·수중'];
  const modal=by('detail'),motion=window.matchMedia('(prefers-reduced-motion: reduce)');
  const cards=new Map();
  let currentFilter='전체',choice,active=null,opener=null;
  let detailScene=null,detailTime=5.3,detailPlaying=false,detailRaf=0,lastTime=null,lastDraw=0;
  const safeIds=v=>Array.isArray(v)?cleanIds(v):null;
  try{choice=safeIds(JSON.parse(localStorage.getItem(key)));}catch{choice=null;}
  const selected=new Set(choice??DEFAULT_IDS);
  const chosen=()=>ROBOTS.filter(r=>selected.has(r.id)).map(r=>r.id);
  const status=text=>{by('gallery-status').textContent=text;};
  const node=(tag,cl,text)=>{
    const el=document.createElement(tag);
    if(cl)el.className=cl;
    if(text!==undefined)el.textContent=text;
    return el;
  };
  const btn=(cl,text)=>{const e=node('button',cl,text);e.type='button';return e;};
  function filter(group){
    currentFilter=group;
    for(const button of by('filters').querySelectorAll('button')){
      const on=button.dataset.group===group;
      button.setAttribute('aria-pressed',String(on));
      button.classList.toggle('active',on);
    }
    for(const item of ROBOTS)cards.get(item.id).card.hidden=group!=='전체'&&item.group!==group;
  }
  function sync(page){
    const ids=chosen();
    for(const item of ROBOTS){
      const row=cards.get(item.id),on=selected.has(item.id);
      row.checkbox.checked=on;
      row.card.classList.toggle('selected',on);row.card.classList.toggle('is-selected',on);
    }
    by('selection-count').textContent=ids.length+'종 선택';
    const list=by('selection-list');
    const chips=ids.map(id=>{
      const item=TYPES.get(id),chip=btn('selection-chip',id+' '+item.name+' ×');
      chip.setAttribute('aria-label',id+' '+item.name+' 선택 해제');
      chip.addEventListener('click',()=>{toggle(id,false);const next=list.querySelector('button');if(next)next.focus();else by('restore-default').focus();});
      return chip;
    });
    list.replaceChildren(...chips);
    by('save-banner').disabled=!ids.length;
    by('copy-ids').disabled=!ids.length;
    by('clear-selection').disabled=!ids.length;
    by('select-all').disabled=ids.length===ROBOTS.length;
    if(active){
      const on=selected.has(active.id);by('detail-toggle').textContent=on?'선택 해제':'이 로봇 선택';
      by('detail-toggle').setAttribute('aria-pressed',String(on));
    }
    const pages=Math.max(1,Math.ceil(ids.length/4));
    player.setIds(ids,Math.max(0,Math.min(page??player.getPage(),pages-1)));
    try{localStorage.setItem(key,JSON.stringify(ids));}catch{/* Changes still apply when local storage is unavailable. */}
  }
  function toggle(id,on){
    if(!TYPES.has(id))return;
    on?selected.add(id):selected.delete(id);
    const page=on?Math.floor(chosen().indexOf(id)/3):player.getPage();
    sync(page);
  }
  function batch(ids){
    selected.clear();ids.forEach(id=>selected.add(id));sync(0);
  }
  function makeCard(item){
    const card=node('article','robot-card'), art=node('div','card-art'),img=node('img','robot-thumbnail');
    card.dataset.id=item.id;img.src=THUMBNAILS[item.id];img.alt=item.name+'의 센서와 측정 대상';img.loading='lazy';img.decoding='async';
    const view=btn('view-motion','동작 보기');view.dataset.id=item.id;view.setAttribute('aria-label',item.name+' 센싱 동작 보기');
    view.addEventListener('click',()=>openDetail(item,view));
    art.append(img,view);
    const content=node('div','card-content'),choiceLabel=node('label','card-choice');
    choiceLabel.setAttribute('for','pick-'+item.id);
    const checkbox=node('input');checkbox.type='checkbox';checkbox.dataset.id=item.id;checkbox.value=item.id;
    checkbox.id='pick-'+item.id;checkbox.setAttribute('aria-label',item.id+' '+item.name+' 선택');
    checkbox.addEventListener('change',()=>toggle(item.id,checkbox.checked));
    const num=node('span','robot-number',item.id),title=node('strong','card-name',item.name);
    const sensor=node('span','card-sensor',item.sensor),task=node('p','card-task',item.task);
    choiceLabel.append(checkbox,num,title);content.append(choiceLabel,sensor,task);card.append(art,content);
    cards.set(item.id,{card,checkbox});return card;
  }
  for(const group of groups){
    const filterButton=btn('filter-button',group);
    filterButton.dataset.group=group;filterButton.addEventListener('click',()=>filter(group));by('filters').append(filterButton);
  }
  grid.replaceChildren(...ROBOTS.map(makeCard));
  by('select-all').addEventListener('click',()=>batch(ROBOTS.map(r=>r.id)));
  by('clear-selection').addEventListener('click',()=>batch([]));
  by('restore-default').addEventListener('click',()=>batch(DEFAULT_IDS));

  function cancelDetailFrame(){
    if(detailRaf)cancelAnimationFrame(detailRaf);detailRaf=0;lastTime=null;
  }
  function detailTick(now){
    if(!active||!detailPlaying||document.hidden){detailRaf=0;lastTime=null;return;}
    if(lastTime!==null)detailTime=(detailTime+Math.min((now-lastTime)/1000,.15))%24;
    lastTime=now;
    if(now-lastDraw>=32){detailScene.draw(detailTime);lastDraw=now;}
    detailRaf=requestAnimationFrame(detailTick);
  }
  function detailPlay(value){
    cancelDetailFrame();detailPlaying=!!value;
    by('detail-play').textContent=detailPlaying?'일시정지':'재생';
    by('detail-play').setAttribute('aria-label',detailPlaying?'센싱 애니메이션 일시정지':'센싱 애니메이션 재생');
    if(detailPlaying&&active&&!document.hidden)detailRaf=requestAnimationFrame(detailTick);
  }
  function fitDetail(){
    if(!active||!detailScene)return;
    const cv=by('detail-field'),rect=cv.getBoundingClientRect();
    if(rect.width>0&&rect.height>0){detailScene.resize(rect.width,rect.height,Math.min(window.devicePixelRatio||1,1.65));detailScene.draw(detailTime);}
  }
  function openDetail(item,trigger){
    active=item;opener=trigger;detailTime=item.id==='01'?16.2:5.3;
    by('detail-name').textContent=item.id+' · '+item.name;
    by('detail-info').textContent=item.en+'  ·  '+item.sensor;
    by('detail-task').textContent=item.task;by('detail-effect').textContent=EFFECT_KEYS[item.effect][1];
    if(!modal.open)modal.showModal();
    if(!detailScene)detailScene=new CandidateField(by('detail-field'),{detail:true});
    detailScene.setIds([item.id],0);fitDetail();
    const on=selected.has(item.id);by('detail-toggle').textContent=on?'선택 해제':'이 로봇 선택';by('detail-toggle').setAttribute('aria-pressed',String(on));
    detailPlay(!motion.matches);
  }
  by('detail-close').addEventListener('click',()=>modal.close());
  modal.addEventListener('close',()=>{
    detailPlay(false);active=null;if(opener?.isConnected)opener.focus();opener=null;
  });
  modal.addEventListener('click',e=>{if(e.target!==modal)return;const b=modal.getBoundingClientRect();
    if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)modal.close();});
  by('detail-toggle').addEventListener('click',()=>{if(active)toggle(active.id,!selected.has(active.id));});
  by('detail-play').addEventListener('click',()=>detailPlay(!detailPlaying));
  document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelDetailFrame();else if(active)detailPlay(detailPlaying);});
  const prefChange=e=>{if(active)detailPlay(!e.matches);};
  if(motion.addEventListener)motion.addEventListener('change',prefChange);else motion.addListener(prefChange);
  if(typeof ResizeObserver==='function')new ResizeObserver(fitDetail).observe(by('detail-field'));else window.addEventListener('resize',fitDetail);

  function decodeBanner(){
    const encoded=by('banner-source').textContent.trim(),bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }
  by('save-banner').addEventListener('click',()=>{
    const ids=chosen();if(ids.length===0)return;
    const template=decodeBanner(),attribute='data-roster="01,03,13,18"';
    if(!template.includes(attribute)){status('배너 파일을 만들 수 없습니다. 파일을 다시 열어 주세요.');return;}
    const html=template.replace(attribute,'data-roster="'+ids.join(',')+'"');
    const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download='fizlab-selected-robots.html';document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
    status(ids.length+'종을 담은 배너 HTML을 저장했습니다.');
  });
  by('copy-ids').addEventListener('click',async()=>{
    const ids=chosen();if(!ids.length)return;
    const text=ids.join(', ');
    try{
      if(!navigator.clipboard?.writeText)throw Error('clipboard');
      await navigator.clipboard.writeText(text);status('선택한 번호를 복사했습니다.');
    }catch{status('선택한 번호  '+text);}
  });
  filter(currentFilter);sync(0);
})();
</script>
</body></html>
